# ============================================================
# Investing.com - USE WITH CAUTION
# Public-facing but has anti-scraping measures
# Prefer API/official sources over this
# ============================================================
investing_com:
  enabled: false  # Disabled by default - use official sources when possible
  base_url: "https://www.investing.com"
  robots_url: "https://www.investing.com/robots.txt"
  legal_risk: high
  note: "High legal risk - ToS prohibits scraping. Use only if no other source available."

# ============================================================
# CBOE (Chicago Board Options Exchange)
# FREE, official, for VIX data
# ============================================================
cboe:
  enabled: true
  vix_history_url: "https://cdn.cboe.com/api/global/us_indices/daily_prices/VIX_History.csv"
  rate_limit_rps: 0.2
  robots_url: "https://www.cboe.com/robots.txt"
  legal_risk: low

# ============================================================
# World Government Bonds
# Public website - check robots.txt before use
# ============================================================
world_govt_bonds:
  enabled: false  # Check robots.txt first - may prohibit scraping
  base_url: "https://www.worldgovernmentbonds.com"
  robots_url: "https://www.worldgovernmentbonds.com/robots.txt"
  legal_risk: medium
  note: "Must verify robots.txt allows crawling before enabling"

# ============================================================
# Taiwan Central Bank (CBC)
# Official source for TWD yields
# ============================================================
taiwan_cbc:
  enabled: true
  base_url: "https://www.cbc.gov.tw"
  bond_yield_url: "https://www.cbc.gov.tw/tw/cp-521-932-40d60-1.html"
  rate_limit_rps: 0.1
  robots_url: "https://www.cbc.gov.tw/robots.txt"
  legal_risk: low
  note: "Official Taiwan central bank; may require manual data extraction"

# ============================================================
# JPM EMBI / CEMBI
# RESTRICTED - Proprietary JPMorgan indices
# No public source available
# ============================================================
jpm_embi:
  enabled: false
  access_level: paid
  legal_risk: high
  alternative: "Use FRED ICE BofA EM series as approximation"
  note: >
    JPM EMBI and CEMBI indices require Bloomberg/JPMorgan terminal access.
    Cannot be freely replicated. Use ICE BofA EM indices from FRED as proxy,
    but methodology differs significantly.

# ============================================================
# Fallback / Manual Data
# For fields that cannot be automatically retrieved
# ============================================================
manual_sources:
  enabled: true
  file_path: "data/raw/manual_overrides.csv"
  note: >
    Some fields (EMBI country-level, CEMBI by rating, some EM local yields)
    must be maintained manually or sourced from paid data vendors.
    This file allows manual override of missing values.

# ============================================================
# Output Configuration
# ============================================================
output:
  formats:
    - csv
    - xlsx
  csv_path: "data/processed/fixed_income_monitor_{date}.csv"
  xlsx_path: "data/processed/fixed_income_monitor_{date}.xlsx"
  date_format: "%Y%m%d"
  missing_value_marker: "N/A"
  percentile_lookback_years: 1
  history_storage: "data/raw/history_{series_id}.csv"
